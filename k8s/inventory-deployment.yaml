apiVersion: apps/v1
kind: Deployment

metadata:
  name: inventory-service
  namespace: shubham-ecommerce

spec:
  replicas: 1

  selector:
    matchLabels:
      app: inventory-service

  template:
    metadata:
      labels:
        app: inventory-service

    spec:
      containers:
      - name: inventory-service
        image: shubham5799/inventory-service:v1
        imagePullPolicy: Always

        ports:
        - containerPort: 5002