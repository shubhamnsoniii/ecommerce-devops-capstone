apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespace: shubham-ecommerce

spec:
  replicas: 1

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
      - name: order-service
        image: shubham5799/order-service:v1
        imagePullPolicy: Always

        ports:
        - containerPort: 5001